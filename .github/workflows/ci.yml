name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-y-pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar paquetes
        run: dotnet restore UltimaMilla.slnx

      - name: Compilar
        run: dotnet build UltimaMilla.slnx --no-restore -c Release

      - name: Pruebas (unitarias y de arquitectura)
        run: dotnet test UltimaMilla.slnx --no-build -c Release

  imagenes-docker:
    runs-on: ubuntu-latest
    needs: build-y-pruebas
    steps:
      - uses: actions/checkout@v4
      - name: Construir imágenes con docker compose
        run: docker compose build
