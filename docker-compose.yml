# Levanta todo el entorno del 8/10:  docker compose up --build
#
# Todo entra por Traefik (único proxy inverso, informe 6.3):
#   Portal del comercio:     http://portal.localhost:8000
#   Backoffice del operador: http://backoffice.localhost:8000
#   API:                     http://api.localhost:8000/api/envios   (salud: /health, /ready, /live)
#   API desde la app móvil:  http://10.0.2.2:8000/api/...  (emulador) o http://localhost:8000/api/... (Windows)
#   Panel de Traefik:        http://localhost:8081
#   Panel de RabbitMQ:       http://rabbit.localhost:8000
#   Grafana (observabilidad): http://grafana.localhost:8000
#
# Monitoreos siguientes: worker, seguimiento y TLS con Let's Encrypt (solo en la nube).
services:
  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "8000:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ultimamilla
      POSTGRES_USER: ultimamilla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ultimamilla_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultimamilla -d ultimamilla"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Caché distribuido y coordinación (RNF 6.7). Todavía no lo consume ningún código:
  # entra con el caché del 22/10 y como backplane de SignalR y Data Protection.
        # Caché distribuido y Data Protection
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Broker de mensajes (RNF 6.8). La API publica por el outbox; el Worker que consume entra el 29/10.
  # El panel de administración va por Traefik.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ultimamilla}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ultimamilla_dev}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbit.localhost`)"
      - "traefik.http.routers.rabbitmq.entrypoints=web"
      # Prioridad sobre el PathPrefix(/api) de la API, que si no se queda con /api/* de este host.
      - "traefik.http.routers.rabbitmq.priority=100"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"

  # Única superficie de telemetría de las aplicaciones (RNF 6.12, stack-tecnologico.md §3).
  # Si al arrancar avisa que no alcanza lgtm:4317 es la carrera de arranque: reintenta y
  # conecta solo.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      lgtm:
        condition: service_started

  # Tablero técnico (RNF 6.12): Grafana con Prometheus, Tempo y Loki en un solo contenedor,
  # el mismo stack que en la nube con un contenedor en lugar de tres. El tablero propio se
  # provisiona desde docker/grafana/. Acceso anónimo como Admin: solo para desarrollo.
  lgtm:
    image: grafana/otel-lgtm:0.36.0
    volumes:
      - ./docker/grafana/tableros.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ultimamilla.yaml:ro
      - ./docker/grafana/tablero-tecnico.json:/otel-lgtm/tablero-tecnico.json:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      # Prioridad sobre el PathPrefix(/api) de la API, que si no se queda con /api/* de este host.
      - "traefik.http.routers.grafana.priority=100"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # Prepara el esquema y los datos de demostración una sola vez y termina. Las réplicas de la
  # API esperan a que haya salido bien, así ninguna siembra en paralelo. Comparte imagen con
  # `api`, así que se construye una sola vez. Acá entra `dotnet ef database update` el 15/10.
  inicializador:
    build:
      context: .
      dockerfile: src/UltimaMilla.Api/Dockerfile
    image: ultimamilla-api:local
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=ultimamilla;Username=ultimamilla;Password=${POSTGRES_PASSWORD:-ultimamilla_dev}"
      # No conecta (termina antes de arrancar el bus), pero Program exige la cadena.
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_USER:-ultimamilla}:${RABBITMQ_PASSWORD:-ultimamilla_dev}@rabbitmq:5672"
      Inicializacion__SoloInicializar: "true"
      Inicializacion__UsuariosDemo: "true"
      Inicializacion__PasswordDemo: "${DEMO_PASSWORD:?Debes definir DEMO_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/UltimaMilla.Api/Dockerfile
    image: ultimamilla-api:local

    # Dos réplicas balanceadas por Traefik
    deploy:
      replicas: 2

    environment:
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=ultimamilla;Username=ultimamilla;Password=${POSTGRES_PASSWORD:-ultimamilla_dev}"
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_USER:-ultimamilla}:${RABBITMQ_PASSWORD:-ultimamilla_dev}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "api"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inicializador:
        condition: service_completed_successfully

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`) || PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.http.services.api.loadbalancer.healthcheck.path=/ready"
      - "traefik.http.services.api.loadbalancer.healthcheck.interval=5s"

  portal:
    build:
      context: .
      dockerfile: src/UltimaMilla.Web.Portal/Dockerfile
    environment:
      # Por Traefik y no por `api:8080`: el DNS de Docker hace round-robin sin chequeo de
      # salud, Traefik saca del pool la réplica que falla /ready antes de enrutarle tráfico.
      Api__BaseUrl: "http://traefik/"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "portal"
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal.rule=Host(`portal.localhost`)"
      - "traefik.http.routers.portal.entrypoints=web"
      - "traefik.http.services.portal.loadbalancer.server.port=8080"

  backoffice:
    build:
      context: .
      dockerfile: src/UltimaMilla.Web.Backoffice/Dockerfile
    environment:
      # Por Traefik y no por `api:8080`: el DNS de Docker hace round-robin sin chequeo de
      # salud, Traefik saca del pool la réplica que falla /ready antes de enrutarle tráfico.
      Api__BaseUrl: "http://traefik/"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "backoffice"
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backoffice.rule=Host(`backoffice.localhost`)"
      - "traefik.http.routers.backoffice.entrypoints=web"
      - "traefik.http.services.backoffice.loadbalancer.server.port=8080"

volumes:
  pgdata:
  redisdata:
