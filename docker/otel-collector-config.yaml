# Collector de OpenTelemetry (stack-tecnologico.md §3): las aplicaciones hablan OTLP solo
# contra el Collector, y el backend de visualización es una decisión de compose, no de código.
# Exporta a grafana/otel-lgtm: Grafana con Prometheus (métricas), Tempo (trazas) y Loki (logs).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Profundidad de las colas (RNF 6.12): el plugin rabbitmq_prometheus, que la imagen trae habilitado,
  # publica los mensajes en espera de cada cola; ninguna aplicación tiene que medirlo.
  prometheus/rabbitmq:
    config:
      scrape_configs:
        - job_name: rabbitmq
          scrape_interval: 15s
          metrics_path: /metrics/detailed
          params:
            family: [queue_coarse_metrics]
          static_configs:
            - targets: ["rabbitmq:15692"]

processors:
  batch: {}

exporters:
  otlp/lgtm:
    endpoint: lgtm:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/lgtm]
    metrics:
      receivers: [otlp, prometheus/rabbitmq]
      processors: [batch]
      exporters: [otlp/lgtm]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/lgtm]
