# Collector de OpenTelemetry (stack-tecnologico.md §3): las aplicaciones hablan OTLP solo
# contra el Collector, y el backend de visualización es una decisión de compose, no de código.
# Exporta a grafana/otel-lgtm: Grafana con Prometheus (métricas), Tempo (trazas) y Loki (logs).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/lgtm:
    endpoint: lgtm:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/lgtm]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/lgtm]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/lgtm]
